<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>とけいの授業</title><style>
*{box-sizing:border-box}html,body{touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f1f6fb;color:#18324b;user-select:none;-webkit-user-select:none}main{height:100dvh;display:flex;flex-direction:column;padding:12px 18px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:clamp(17px,2.6vw,26px);margin:0}.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button,select{font:inherit;border:1px solid #c5d6e4;border-radius:12px;background:white;color:#18324b;padding:9px 13px;cursor:pointer;font-weight:650}button:active{background:#e1effc}.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}.panel{background:white;border-radius:22px;box-shadow:0 4px 20px #284a6810;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px}.clock{height:min(100%,calc((100vw - 70px)/2));max-width:100%;aspect-ratio:1;touch-action:none;overflow:visible}.face{fill:#fff;stroke:#d5e3ef;stroke-width:3}.tick{stroke:#a7bacb;stroke-width:1.7}.tick.major{stroke:#3c607e;stroke-width:3.5}.num{font-size:11px;font-weight:700;fill:#193b5b;text-anchor:middle;dominant-baseline:central}.hand{stroke-linecap:round;cursor:grab}.hour{stroke:#1e5279;stroke-width:7}.minute{stroke:#ec8a3b;stroke-width:5}.center{fill:#1e5279}.right{gap:14px}.hidden-answer{font-size:clamp(26px,4vw,52px);font-weight:800;color:#8aa0b3;letter-spacing:.1em}.digital-wrap{min-height:135px;display:flex;align-items:center;justify-content:center}.answer-button{background:#e5f1ff;border-color:#8db7e2}.snap-label{font-size:13px;font-weight:700;color:#526e83}.snap-active{background:#245b87;color:white;border-color:#245b87}.digital{font-weight:800;letter-spacing:.02em;text-align:center;font-variant-numeric:tabular-nums}.digital .big{font-size:clamp(48px,8vw,110px);line-height:1.2}.digital .sub{font-size:clamp(22px,4vw,55px);line-height:1.25;color:#51758e}.caption{font-size:clamp(13px,1.7vw,20px);color:#657e91;text-align:center}.adjust{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.adjust button{min-width:64px}.hint{font-size:12px;color:#68839b;text-align:center}@media(max-width:650px) and (orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.clock{height:100%}.digital .big{font-size:48px}main{padding:8px;gap:6px}.panel{border-radius:14px}.top h1{font-size:16px}button,select{padding:7px;font-size:13px}}@media(max-height:420px){main{padding:5px 10px;gap:4px}.top h1{font-size:16px}.panel{padding:2px}.right{gap:4px}.digital .big{font-size:clamp(35px,7vw,80px)}.digital .sub{font-size:clamp(20px,3.5vw,38px)}.caption,.hint{font-size:11px}button,select{padding:5px 9px}}
</style></head><body><main><header class="top"><h1>🕒 とけいの授業</h1><div class="tools"><select id="mode" aria-label="デジタル表示"><option value="both">両方表示</option><option value="ampm">ごぜん / ごご</option><option value="24">24時間表示</option></select><select id="snap" aria-label="針の動き"><option value="1">1分刻み</option><option value="5">5分刻み</option><option value="free">自由に動かす</option></select><button id="answer" class="answer-button" aria-pressed="false">答えを隠す</button><button id="reset">12:00に戻す</button><button id="now">今の時刻</button></div></header><div class="stage"><section class="panel"><svg class="clock" id="clock" viewBox="0 0 240 240" aria-label="指で針を動かせるアナログ時計"><circle class="face" cx="120" cy="120" r="113"/><g id="ticks"></g><g id="numbers"></g><line id="hour" class="hand hour" x1="120" y1="120" x2="120" y2="66"/><line id="minute" class="hand minute" x1="120" y1="120" x2="120" y2="34"/><circle class="center" cx="120" cy="120" r="5"/></svg><div class="hint">長針・短針を指で動かしてね</div></section><section class="panel right"><div class="caption">デジタル時計</div><div class="digital-wrap"><div id="digital" class="digital" aria-live="off"></div><div id="hidden" class="hidden-answer" hidden>？？：？？</div></div><div class="adjust"><button data-add="-60">−1時間</button><button data-add="-5">−5分</button><button data-add="-1">−1分</button><button data-add="1">＋1分</button><button data-add="5">＋5分</button><button data-add="60">＋1時間</button></div><div class="caption" id="daynote"></div></section></div></main><script>
let minutes=12*60,drag=null,lastAngle=0,accum=0,dragStart=0,answerHidden=false;const $=id=>document.getElementById(id),svg=$('clock');const pad=n=>String(n).padStart(2,'0');const norm=n=>((n%1440)+1440)%1440;
for(let i=0;i<60;i++){let a=i*Math.PI/30,x1=120+Math.sin(a)*(i%5===0?97:102),y1=120-Math.cos(a)*(i%5===0?97:102),x2=120+Math.sin(a)*108,y2=120-Math.cos(a)*108;let l=document.createElementNS('http://www.w3.org/2000/svg','line');for(let [k,v] of Object.entries({x1,y1,x2,y2}))l.setAttribute(k,v);l.setAttribute('class','tick'+(i%5===0?' major':''));$('ticks').append(l)}for(let i=1;i<=12;i++){let a=i*Math.PI/6,t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',120+Math.sin(a)*79);t.setAttribute('y',120-Math.cos(a)*79);t.setAttribute('class','num');t.textContent=i;$('numbers').append(t)}
function render(){let m=norm(minutes),h=Math.floor(m/60),min=m%60,ha=((h%12)+min/60)*30,ma=min*6;for(let [id,a,len] of [['hour',ha,53],['minute',ma,86]]){let r=a*Math.PI/180;$ (id).setAttribute('x2',120+Math.sin(r)*len);$(id).setAttribute('y2',120-Math.cos(r)*len)}let mode=$('mode').value,ap=(h<12?'ごぜん':'ごご')+' '+(h%12||12)+':'+pad(min),full=pad(h)+':'+pad(min);$('digital').innerHTML=mode==='both'?'<div class="big">'+full+'</div><div class="sub">'+ap+'</div>':mode==='24'?'<div class="big">'+full+'</div>':'<div class="big">'+ap+'</div>';$('daynote').textContent=answerHidden?'針を読んで時刻を考えよう':(h<12?'ごぜん':'ごご');$('digital').hidden=answerHidden;$('hidden').hidden=!answerHidden}
function angle(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());return Math.atan2(q.x-120,120-q.y)*180/Math.PI}function distance(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());return Math.hypot(q.x-120,q.y-120)}
svg.addEventListener('pointerdown',e=>{let r=distance(e);if(r<12||r>112)return;let a=angle(e),ma=norm(minutes)%60*6,ha=(norm(minutes)/60%12)*30;let diff=(x,y)=>Math.abs(((x-y+540)%360)-180);drag=(e.target.id==='hour'||e.target.id==='minute')?e.target.id:(r<67?'hour':'minute');if(r>=67&&r<75)drag=diff(a,ha)<diff(a,ma)?'hour':'minute';lastAngle=a;accum=0;dragStart=minutes;svg.setPointerCapture(e.pointerId);e.preventDefault()});svg.addEventListener('pointermove',e=>{if(!drag)return;let a=angle(e),delta=((a-lastAngle+540)%360)-180;lastAngle=a;accum+=delta;let raw=dragStart+accum*(drag==='minute'?1/6:2);let snap=$('snap').value;minutes=snap==='5'?Math.round(raw/5)*5:Math.round(raw);render();e.preventDefault()});function stop(){drag=null;accum=0}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);$('mode').addEventListener('change',render);$('answer').addEventListener('click',()=>{answerHidden=!answerHidden;$('answer').textContent=answerHidden?'答えを見る':'答えを隠す';$('answer').setAttribute('aria-pressed',String(answerHidden));render()});document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{minutes+=Number(b.dataset.add);render()}));$('reset').addEventListener('click',()=>{minutes=720;render()});$('now').addEventListener('click',()=>{let d=new Date();minutes=d.getHours()*60+d.getMinutes();render()});render();
// iPad Safari: ダブルタップ・ピンチによるページ拡大を抑止（時計のドラッグは維持）
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
for(const name of ['gesturestart','gesturechange','gestureend']){document.addEventListener(name,e=>e.preventDefault(),{passive:false});}
</script></body></html>
